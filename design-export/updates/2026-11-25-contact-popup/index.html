<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORREST — Зв'язатися / Передзвоніть мені</title>
<link rel="stylesheet" href="./contact.css">
<style>body{margin:0;background:#F7F2E8}.demo-header{display:flex;justify-content:flex-end;padding:24px clamp(16px,4vw,48px)}</style>
</head>
<body>
<!-- ДЕМО-ХЕДЕР: на сайті вставте лише кнопку .fc-btn у свій хедер -->
<header class="demo-header">
<!-- ===== Кнопка «Зв'язатися» ===== -->
<a href="#callback" class="fc-btn" data-fc-open aria-label="Зв'язатися" aria-haspopup="dialog"><span class="fc-btn__label">Зв'язатися</span><span class="fc-btn__icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.6 3.6 6.9 3.2a1.9 1.9 0 0 0-2.1 1C4.1 5.6 3.6 7.4 4.3 9.6c1.9 5.6 4.5 8.2 10.1 10.1 2.2.7 4 .2 5.4-.5a1.9 1.9 0 0 0 1-2.1l-.4-1.7a1.9 1.9 0 0 0-1.4-1.4l-2.6-.6a1.9 1.9 0 0 0-1.8.5l-.9.9a12 12 0 0 1-4.4-4.4l.9-.9a1.9 1.9 0 0 0 .5-1.8L10 5a1.9 1.9 0 0 0-1.4-1.4Z"></path><path d="M15 3.5a6 6 0 0 1 5.5 5.5" opacity=".55"></path><path d="M14.6 7a2.6 2.6 0 0 1 2.4 2.4" opacity=".55"></path></svg></span></a>
</header>

<!-- ===== Попап «Передзвоніть мені» (вставити один раз перед </body>) ===== -->
<div class="fc-pop" id="callback" role="dialog" aria-modal="true" aria-label="Зв'язатися з нами" hidden>
<div class="fc-pop__card">
<div class="fc-pop__img"><img src="./img/contact-popup-winter.avif" alt="FORREST Trinity Resort взимку"></div>
<div class="fc-pop__body">
<button type="button" class="fc-pop__x" data-fc-close aria-label="Закрити"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<div class="fc-step" data-fc-step>
<h2 class="fc-pop__title">Бажаєте отримати більше інформації про FORREST Trinity Resort?</h2>
<form class="fc-form" data-fc-form novalidate>
<input class="fc-input" name="name" type="text" autocomplete="name" placeholder="Ваше ім'я">
<input class="fc-input" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+38 (0__) ___-__-__" aria-describedby="fc-err">
<span class="fc-err" id="fc-err" data-fc-err hidden>Вкажіть номер телефону</span>
<button type="submit" class="fc-submit">Передзвоніть мені<span class="fc-submit__icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.6 3.6 6.9 3.2a1.9 1.9 0 0 0-2.1 1C4.1 5.6 3.6 7.4 4.3 9.6c1.9 5.6 4.5 8.2 10.1 10.1 2.2.7 4 .2 5.4-.5a1.9 1.9 0 0 0 1-2.1l-.4-1.7a1.9 1.9 0 0 0-1.4-1.4l-2.6-.6a1.9 1.9 0 0 0-1.8.5l-.9.9a12 12 0 0 1-4.4-4.4l.9-.9a1.9 1.9 0 0 0 .5-1.8L10 5a1.9 1.9 0 0 0-1.4-1.4Z"></path><path d="M15 3.5a6 6 0 0 1 5.5 5.5" opacity=".55"></path><path d="M14.6 7a2.6 2.6 0 0 1 2.4 2.4" opacity=".55"></path></svg></span></button>
</form>
</div>
<div class="fc-done" data-fc-done hidden>
<span class="fc-done__mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h2 class="fc-done__title">Дякуємо!</h2>
<p class="fc-done__text">Уляна Белінська зателефонує вам найближчим часом.</p>
</div>
</div>
</div>
</div>
<script src="./contact.js"></script>
</body>
</html>
