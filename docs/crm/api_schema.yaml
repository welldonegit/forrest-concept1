  /api/v1/converter/nbu:
    get:
      operationId: converterNbu
      description: |-
        Converts an amount from a specified currency to one or more target currencies using exchange rates provided by the National Bank of Ukraine (NBU).
        Requires active 'nbu-rates' plugin for the user's company.
      summary: Convert currency using NBU rates
      parameters:
      - in: query
        name: amount
        schema:
          type: string
        description: Amount of money to convert
        required: true
      - in: query
        name: from
        schema:
          type: string
        description: Currency code to convert from (e.g. USD, EUR, UAH)
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Comma-separated list of target currency codes (e.g. UAH,EUR,PLN)
        required: true
      tags:
      - Currency converter
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NbuConverterResponse'
              examples:
                ConversionResultSample:
                  value:
                    from: UAH
                    amount: '4120.00'
                    result:
                      USD: '100.00'
                      EUR: '92.00'
                    rates:
                      USD: '0.024272'
                      EUR: '0.022330'
                  summary: Sample conversion response
          description: ''
