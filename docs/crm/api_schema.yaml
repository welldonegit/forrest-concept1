components:
  schemas:
    Ad:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AdTypeEnum'
        screenshot:
          type: string
          nullable: true
        iframe:
          type: string
          nullable: true
        title:
          type: string
        ad_url:
          type: string
      required:
      - ad_url
      - iframe
      - screenshot
      - title
      - type
    AdTypeEnum:
      enum:
      - screenshot
      - iframe
      type: string
      description: |-
        * `screenshot` - screenshot
        * `iframe` - iframe
    Agency:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 250
        phone:
          type: string
          maxLength: 250
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        is_deleted:
          type: boolean
        employees:
          type: array
          items:
            $ref: '#/components/schemas/AgencyEmployee'
          readOnly: true
          description: Agency employees configured in the agency management page.
      required:
      - employees
      - id
      - phone
      - title
    AgencyEmployee:
      type: object
      properties:
        id:
          type: string
          description: Agency employee identifier used in agency lead registration
            links.
        name:
          type: string
          description: Agency employee name.
        phone:
          type: string
          description: Agency employee phone number.
        email:
          type: string
          nullable: true
          description: Agency employee email.
        is_deleted:
          type: boolean
          default: false
          description: Whether the agency employee is deleted.
      required:
      - id
      - name
      - phone
    AgencyEmployeeRegistration:
      type: object
      properties:
        name:
          type: string
          description: Agency employee name.
          maxLength: 250
        phone:
          type: string
          description: Agency employee phone number.
          maxLength: 250
        email:
          type: string
          format: email
          nullable: true
          description: Agency employee email.
      required:
      - name
      - phone
    AgencyRegistration:
      type: object
      properties:
        title:
          type: string
          description: Agency title.
          maxLength: 250
        phone:
          type: string
          description: Agency phone number.
          maxLength: 250
        email:
          type: string
          format: email
          nullable: true
          description: Agency email.
        contact_name:
          type: string
          nullable: true
          description: Agency contact person name.
          maxLength: 250
        contact_phone:
          type: string
          nullable: true
          description: Agency contact person phone number.
          maxLength: 250
        url:
          type: string
          description: Agency website URL.
          maxLength: 250
        percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          default: '0.00'
          description: Agency commission percent.
        employees:
          type: array
          items:
            $ref: '#/components/schemas/AgencyEmployeeRegistration'
          description: Initial agency employees to register with the agency.
      required:
      - phone
      - title
    ApartmentFeatureEnum:
      enum: []
      type: boolean
    BlankEnum:
      enum:
      - ''
    BookingTypeEnum:
      enum:
      - free
      - paid
      type: string
      description: |-
        * `free` - free
        * `paid` - paid
    Building:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
      - updated_at
    BuildingClassEnum:
      enum:
      - economy
      - comfort
      - business
      - elite
      type: string
      description: |-
        * `economy` - economy
        * `comfort` - comfort
        * `business` - business
        * `elite` - elite
    BuildingDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        file_size:
          type: integer
          readOnly: true
          nullable: true
        location:
          type: string
          readOnly: true
          nullable: true
        location_point:
          type: string
          readOnly: true
          nullable: true
          description: Geographic point in EWKT format.
        title:
          type: string
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
          nullable: true
        user:
          type: integer
          readOnly: true
        parent:
          type: integer
          readOnly: true
          nullable: true
        parent_title:
          type: string
          readOnly: true
          nullable: true
          description: Parent building title, set when parent is not found
        section:
