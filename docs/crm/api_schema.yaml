openapi: 3.0.3
info:
  title: G-PLUS CRM Public API
  version: 1.0.0
  description: |
    # Authorization

    You can find the API token in your [profile settings](/manage/profile).

    The API token should be passed in the `Authorization` header. Example:

    ```
    Authorization: Token <key>
    ```
  contact:
    email: bq@g-plus.app
paths:
  /api/v1/agencies:
    get:
      operationId: agenciesList
      description: Returns list of real estate agencies for the current company, including
        configured agency employees.
      summary: List Agencies
      parameters:
      - name: order_by
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Agencies
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agency'
          description: ''
    post:
      operationId: agenciesCreate
      summary: Register Agency
      tags:
      - Agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyRegistration'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
  /api/v1/agencies/{id}:
    get:
      operationId: agenciesRetrieve
      summary: Retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this agency.
        required: true
      tags:
      - Agencies
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
  /api/v1/agencies/{id}/employees:
    post:
      operationId: agenciesEmployeesCreate
      summary: Register Agency Employee
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this agency.
        required: true
      tags:
      - Agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyEmployeeRegistration'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyEmployee'
          description: ''
  /api/v1/buildings:
    get:
      operationId: buildingsList
      description: Returns the compact list of projects the authenticated user can
        access. API tokens require the `buildings.read` scope.
      summary: List
      parameters:
      - name: fields
        required: true
        in: query
        description: 'Specify required fields by comma. You could also include <b>nested
          fields</b> of <b>expandable fields</b> by using dot syntax (see the example
          below).<br>Possible values:<br>`id,title,created_at,updated_at`<br>Expandable
          fields:<br>&mdash;<br><br>Example usage: `?fields=id,title`'
        schema:
          title: Selected fields
          type: string
      - name: order_by
        required: false
        in: query
        description: |-
          Which field to use when ordering the results.

          Options:

          * `id`, `-id`
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Buildings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
          description: ''
      x-required-token-scope: buildings.read
  /api/v1/buildings/{buildingId}/photos:
    get:
      operationId: buildingsPhotosList
      description: API tokens require the `building_photos.read` scope. Session-authenticated
        requests use the existing API authorization behavior.
      summary: List building photos
      parameters:
      - name: order_by
        required: false
        in: query
        description: |-
          Which field to use when ordering the results.

          Options:

          * `id`, `-id`
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: 'Number of results to return per page. Default: `20`'
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - Building photos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildingPhotoList'
          description: ''
      x-required-token-scope: building_photos.read
    post:
      operationId: buildingsPhotosCreate
      description: API tokens require the `building_photos.write` scope. Session-authenticated
        requests use the existing API authorization behavior.
      summary: Upload building photo
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      tags:
      - Building photos
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  type: string
                  format: binary
                is_default:
                  type: boolean
                is_visible:
                  type: boolean
                resale_media_type:
                  type: string
                  enum:
                  - object_photo
                  - house_photo
                  - layout
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingPhoto'
          description: ''
      x-required-token-scope: building_photos.write
  /api/v1/buildings/{buildingId}/photos/{id}:
    get:
      operationId: buildingsPhotosRetrieve
      description: API tokens require the `building_photos.read` scope. Session-authenticated
        requests use the existing API authorization behavior.
      summary: Retrieve building photo
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this building photo.
        required: true
      tags:
      - Building photos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingPhoto'
          description: ''
      x-required-token-scope: building_photos.read
    patch:
      operationId: buildingsPhotosPartialUpdate
      description: API tokens require the `building_photos.write` scope. Session-authenticated
        requests use the existing API authorization behavior.
      summary: Update building photo
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this building photo.
        required: true
      tags:
      - Building photos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuildingPhotoUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBuildingPhotoUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBuildingPhotoUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingPhoto'
          description: ''
      x-required-token-scope: building_photos.write
    delete:
      operationId: buildingsPhotosDestroy
      description: API tokens require the `building_photos.write` scope. Session-authenticated
        requests use the existing API authorization behavior.
      summary: Delete building photo
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this building photo.
        required: true
      tags:
      - Building photos
      responses:
        '204':
          description: No response body
      x-required-token-scope: building_photos.write
  /api/v1/buildings/{buildingId}/tables:
    get:
      operationId: buildingsTablesList
      description: Returns list of crosstabs the user has access to.
      summary: List
      parameters:
      - name: fields
        required: true
        in: query
        description: 'Specify required fields by comma. You could also include <b>nested
          fields</b> of <b>expandable fields</b> by using dot syntax (see the example
          below).<br>Possible values:<br>`id,title,is_public,currency,created_at,updated_at,units,created_by`<br>Expandable
          fields:<br>`units`, `created_by`<br><br>Example usage: `?fields=id,title,units.name,units.id`'
        schema:
          title: Selected fields
          type: string
      - name: order_by
        required: false
        in: query
        description: |-
          Which field to use when ordering the results.

          Options:

          * `id`, `-id`
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: 'Number of results to return per page. Default: `20`'
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - Crosstabs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildingTableList'
          description: ''
  /api/v1/buildings/{buildingId}/tables/{id}:
    get:
      operationId: buildingsTablesRetrieve
      summary: Retrieve
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - name: fields
        required: true
        in: query
        description: 'Specify required fields by comma. You could also include <b>nested
          fields</b> of <b>expandable fields</b> by using dot syntax (see the example
          below).<br>Possible values:<br>`id,title,is_public,currency,created_at,updated_at,units,created_by`<br>Expandable
          fields:<br>`units`, `created_by`<br><br>Example usage: `?fields=id,title,units.name,units.id`'
        schema:
          title: Selected fields
          type: string
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this building table.
        required: true
      tags:
      - Crosstabs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandedBuildingTable'
          description: ''
  /api/v1/buildings/{buildingId}/tables/{tableId}/unit_mass_update:
    patch:
      operationId: unitsMassUpdate
      description: |-
        **Mass update of units**. Filters can be applied to select which units to update.

        Apply filters from [list of units](#tag/Units/operation/buildingsTablesUnitsList)

        Example: PATCH /api/v1/buildings/{building_id}/tables/{table_id}/unit_mass_update?layout_type=modern&status=free
      summary: Partial update
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - in: path
        name: tableId
        schema:
          type: integer
        required: true
      tags:
      - Units mass update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUnit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchedUnit'
          description: ''
  /api/v1/buildings/{buildingId}/tables/{tableId}/units:
    get:
      operationId: buildingsTablesUnitsList
      description: Returns list of units the user has access to.
      summary: List
      parameters:
      - name: fields
        required: true
        in: query
        description: 'Specify required fields by comma. You could also include <b>nested
          fields</b> of <b>expandable fields</b> by using dot syntax (see the example
          below).<br>Possible values:<br>`id,tp,pos,view,floor_title,price,full_price,rooms,images,documents,number,prices,square,status,section,squares,entrance,brokering,contact_id,is_booking,updated_at,updated_by,description,is_assigned,layout_type,lock_reason,apartment_id,floor_section,vt_iframe_url,directions,commercial_types,apartment_feature,installment_months,commercial_purposes,custom_field_values,promos,drawable`<br>Expandable
          fields:<br>&mdash;<br><br>Example usage: `?fields=id,tp`'
        schema:
          title: Selected fields
          type: string
      - in: query
        name: ids
        schema:
          type: string
          title: IDs
        description: 'Concatenated with comma: "1,2,3"'
      - name: order_by
        required: false
        in: query
        description: |-
          Which field to use when ordering the results.

          Options:

          * `id`, `-id`
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: apartment_id
        schema:
          type: string
        description: 'Concatenated with comma: "1,2,3"'
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - east
          - north
          - south
          - west
        description: |-
          * `north` - north
          * `west` - west
          * `south` - south
          * `east` - east
      - in: query
        name: floor_title
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: string
      - in: query
        name: layout_type
        schema:
          type: string
      - in: query
        name: number
        schema:
          type: string
      - in: query
        name: rooms
        schema:
          type: array
          items:
            type: string
            enum:
            - '0'
            - '1'
            - '2'
            - '3'
            - '4'
            - '5'
        description: |-
          * `0` - Studio
          * `1` - 1 room
          * `2` - 2 rooms
          * `3` - 3 rooms
          * `4` - 4 rooms
          * `5` - 5 rooms
        explode: true
        style: form
      - in: query
        name: section
        schema:
          type: string
          nullable: true
          enum:
          - commercial
          - garages
          - living
          - parking
          - storage-room
        description: |-
          * `living` - living
          * `commercial` - commercial
          * `parking` - parking
          * `storage-room` - storage-room
          * `garages` - garages
      - in: query
        name: square__gte
        schema:
          type: string
      - in: query
        name: square__lte
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - assigned
            - booked
            - brokered
            - free
            - locked
            - sold
        description: |-
          * `free` - free
          * `booked` - booked
          * `locked` - locked
          * `sold` - sold
          * `assigned` - assigned
          * `brokered` - brokered
        explode: true
        style: form
      - in: path
        name: tableId
        schema:
          type: integer
        required: true
      - in: query
        name: tp
        schema:
          type: string
      tags:
      - Units
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
          description: ''
  /api/v1/buildings/{buildingId}/tables/{tableId}/units/{id}:
    get:
      operationId: buildingsTablesUnitsRetrieve
      summary: Retrieve
