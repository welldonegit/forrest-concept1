        schema:
          type: string
          format: date
      - in: query
        name: processing_at_gte
        schema:
          type: string
          format: date-time
        description: 'ISO8601: `2025-01-01T05:00:00+02:00`. Please note, the `+` sign
          should be encoded in the URL (`%2b`), otherwise it will be received as a
          blank space and `Enter a valid date/time.` error appear.'
      - in: query
        name: processing_at_lte
        schema:
          type: string
          format: date-time
        description: 'ISO8601: `2025-01-01T05:00:00+02:00`. Please note, the `+` sign
          should be encoded in the URL (`%2b`), otherwise it will be received as a
          blank space and `Enter a valid date/time.` error appear.'
