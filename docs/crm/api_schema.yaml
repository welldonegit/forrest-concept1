      type: object
      properties:
        contact:
          type: integer
          minimum: 1
          nullable: true
          description: CRM contact ID. Create it first via `POST /api/v1/contacts`.
            Optional when `agency` is provided.
        agency:
          type: integer
          minimum: 1
          nullable: true
          description: Optional agency ID from `GET /api/v1/agencies`.
        agency_employee_id:
          type: string
          nullable: true
          description: Optional agency employee ID returned by the agencies API.
          maxLength: 50
        booking_type:
          allOf:
          - $ref: '#/components/schemas/BookingTypeEnum'
          default: free
          description: |-
            `free` creates a verbal booking. `paid` creates a paid booking and requires `booking_paid_at` and `booking_amount`.

            * `free` - free
            * `paid` - paid
        booking_expired_at:
          type: string
          format: date
          description: Date until which the booking is active, in `YYYY-MM-DD` format.
        booking_paid_at:
          type: string
          format: date
          nullable: true
          description: Required for paid bookings. Payment date in `YYYY-MM-DD` format.
        booking_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Required for paid bookings. Paid booking amount in company
            default currency.
        title:
          type: string
          description: Optional booking agreement title.
          maxLength: 250
        note:
          type: string
          description: Optional booking note.
        data:
          type: object
          additionalProperties: {}
          description: Optional extra booking metadata.
      required:
      - booking_expired_at
