      - in: query
        name: tags_and
        schema:
          type: string
        description: Comma separated tags. Tag name from [list of tags](#tag/Tags)
      - in: query
        name: tags_or
        schema:
          type: string
        description: Comma separated tags. Tag name from [list of tags](#tag/Tags)
      - in: query
        name: updated_at
        schema:
          type: string
          format: date
        description: '`updated_at` date is exactly on'
      - in: query
        name: updated_at_gte
        schema:
          type: string
          format: date-time
        description: 'ISO8601: `2025-01-01T05:00:00+02:00`. Please note, the `+` sign
          should be encoded in the URL (`%2b`), otherwise it will be received as a
          blank space and `Enter a valid date/time.` error appear.'
      - in: query
        name: updated_at_lte
        schema:
          type: string
          format: date-time
        description: 'ISO8601: `2025-01-01T05:00:00+02:00`. Please note, the `+` sign
          should be encoded in the URL (`%2b`), otherwise it will be received as a
          blank space and `Enter a valid date/time.` error appear.'
      - in: query
        name: with_files
        schema:
          type: boolean
      tags:
      - Leads
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeadList'
          description: ''
