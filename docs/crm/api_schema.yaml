        schema:
          type: boolean
        description: Show only target leads according to the company's target lead
          settings.
      - in: query
        name: only_with_dup
        schema:
          type: boolean
        description: Show only leads that have duplicates.
      - in: query
        name: overdue_tasks
        schema:
          type: boolean
        description: Show only leads that have overdue unfinished tasks.
