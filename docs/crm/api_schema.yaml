      type: object
      properties:
        unit_id:
          type: string
          description: Crosstab unit ID.
        apartment:
          type: string
          description: CRM apartment key in `{table_id}-{unit_id}` format.
        status:
          type: string
          nullable: true
          description: Current crosstab unit status.
        can_create_booking:
          type: boolean
          description: Whether a new booking can currently be created for the unit.
        blocked_reason:
          type: string
          nullable: true
          description: Reason why a new booking is blocked, for example `paid_booking_locked`
            or `unit_unavailable`.
        paid_booking:
          allOf:
          - $ref: '#/components/schemas/UnitBookingStateItem'
          nullable: true
          description: Active paid booking for the unit. When present, it locks the
            unit and new bookings cannot be created.
        queue:
          type: array
          items:
            $ref: '#/components/schemas/UnitBookingStateItem'
          description: Active verbal/free bookings ordered by booking expiration date.
            These bookings form a queue for the unit.
        available_booking:
          allOf:
          - $ref: '#/components/schemas/UnitBookingAvailability'
          nullable: true
          description: Next available date range for creating a verbal/free booking,
            or null when booking is blocked.
        available_paid_booking:
          allOf:
          - $ref: '#/components/schemas/UnitPaidBookingAvailability'
          nullable: true
          description: Available date range for creating a paid booking, or null when
            booking is blocked.
