        name: property_type
        schema:
          type: string
      - in: query
        name: purpose
        schema:
          type: string
      - in: query
        name: rooms_gte
        schema:
          type: number
      - in: query
        name: rooms_lte
        schema:
          type: number
      - in: query
        name: source
        schema:
          type: string
        description: Filter by source. The available lead sources can be retrieved
          via the <a href="#tag/Sources/operation/getSourceList">/lead_sources</a>
          endpoint<br/>Multiple values are supported by comma separated string, e.g.,
          `?source=instagram,custom:abcdef12`
      - in: query
        name: stage_id
        schema:
          type: array
          items:
            type: string
        description: Filter by Stage ID from <a href="#tag/funnels">list of pipelines</a>.<br/>Multiple
          values are supported by repeating the parameter, e.g., `?stage_id=abc123&stage_id=def456`
        explode: true
        style: form
      - in: query
        name: success_without_deal
        schema:
          type: boolean
        description: Show only leads in a success stage without an active approved
