                $ref: '#/components/schemas/PatchedUnit'
          description: ''
  /api/v1/buildings/{buildingId}/tables/{tableId}/units/{id}/bookings:
    get:
      operationId: buildingsTablesUnitsBookingsRetrieve
      description: Returns active booking state for this unit without exposing client
        details. `paid_booking` is the current active paid booking for the unit. When
        it is present, the unit is locked for new bookings. `queue` contains active
        verbal/free bookings ordered by expiration date; each item has a `queue_position`.
        Booking items include the CRM manager, attached agency, and `is_own`, which
        is true when the current API user is the booking manager or creator. The response
        also includes the next available verbal booking date range when booking is
        not blocked, plus the paid booking date range with the paid-booking max duration.
      summary: Get booking queue
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this building table.
        required: true
      - in: path
        name: tableId
        schema:
          type: integer
        required: true
      tags:
      - Units
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitBookingState'
          description: ''
    post:
      operationId: buildingsTablesUnitsBookingsCreate
      description: Creates a crosstab unit booking deal for this unit. For client
        bookings, create or reuse a CRM contact first and pass its `id` as `contact`.
        For agency-only bookings, pass `agency` from `GET /api/v1/agencies` without
        `contact`; the CRM will use the agency system contact. Agency-only bookings
        require the company crosstab setting `allow_agency_bookings` to be enabled.
        The endpoint applies the same crosstab booking availability, duration, paid-booking
        lock, and queue-conflict rules as the CRM UI.
      summary: Create booking
      parameters:
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - name: fields
        required: true
        in: query
        description: 'Specify required fields by comma. You could also include <b>nested
          fields</b> of <b>expandable fields</b> by using dot syntax (see the example
          below).<br>Possible values:<br>`id,tp,pos,view,floor_title,price,full_price,rooms,images,documents,number,prices,square,status,section,squares,entrance,brokering,contact_id,is_booking,updated_at,updated_by,description,is_assigned,layout_type,lock_reason,apartment_id,floor_section,vt_iframe_url,directions,commercial_types,apartment_feature,installment_months,commercial_purposes,custom_field_values,promos,drawable`<br>Expandable
          fields:<br>&mdash;<br><br>Example usage: `?fields=id,tp`'
        schema:
          title: Selected fields
          type: string
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this building table.
        required: true
      - in: path
        name: tableId
        schema:
          type: integer
        required: true
      tags:
      - Units
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitBooking'
            examples:
              ClientVerbalBooking:
                value:
                  contact: 123
                  agency: 45
                  booking_expired_at: '2026-08-05'
                  title: Agent verbal booking
                summary: Client verbal booking
              AgencyVerbalBooking:
                value:
                  agency: 45
                  booking_expired_at: '2026-08-05'
                  title: Agency verbal booking
                summary: Agency verbal booking
              PaidBooking:
                value:
                  contact: 123
                  agency: 45
                  booking_type: paid
                  booking_expired_at: '2026-08-05'
                  booking_paid_at: '2026-08-03'
                  booking_amount: '500.00'
                summary: Paid booking
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitBookingResponse'
          description: ''
  /api/v1/buildings/{buildingId}/tables/{tableId}/units/{id}/bookings/{bookingId}:
    delete:
      operationId: buildingsTablesUnitsBookingsDestroy
      description: Cancels an active booking owned by the current API user. Free bookings
        do not require a request body. Paid bookings require `cancel_reason` containing
        a company-configured reason or `other`; `other_reason` is optional. An invalid
        or missing paid booking reason returns the accepted values in `available_reasons`.
      summary: Cancel booking
      parameters:
      - in: path
        name: bookingId
        schema:
          type: integer
        required: true
      - in: path
        name: buildingId
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this building table.
        required: true
      - in: path
        name: tableId
        schema:
          type: integer
        required: true
      tags:
      - Units
      responses:
        '204':
