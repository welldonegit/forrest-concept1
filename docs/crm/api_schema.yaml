      - in: query
        name: missed_calls_leads
        schema:
          type: boolean
        description: Show leads with missed incoming calls that were not processed.
      - in: query
        name: only_mine
        schema:
          type: boolean
        description: Show only leads where the current user is responsible manager
          or has a lead process.
      - in: query
