            additionalProperties: {}
          readOnly: true
          description: Stage IDs from <a href="#tag/funnels">list of pipelines</a>
        fail_reasons:
          type: array
          items:
            type: string
          readOnly: true
        stage_id:
          type: string
          writeOnly: true
          description: Stage ID to move the lead to
        tags:
          type: array
          items:
            type: integer
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        objects:
          type: array
          items:
            $ref: '#/components/schemas/Object'
          description: Buildings and units the lead is interested in
        processes_history:
          type: array
          items:
            $ref: '#/components/schemas/ProcessesHistoryItem'
          readOnly: true
          description: |-
            Processing history: list of stage changes.
            Example:
            <pre>[
              {
                "user_id": 123,
                "user_name": "John Doe",
                "title": "Meet up",
                "stage_id": "abcdef123",
                "moved_at": "2025-01-15T14:30:00+02:00"
              },
              ...
            ]</pre>
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
          readOnly: true
          description: |-
            Lead change history.
            Example:
            <pre>[
              {
                "user_id": 123,
                "user_name": "John Doe",
                "changed_at": "2025-01-15T14:30:00+02:00",
                "message": "Field Note updated: old to new"
              },
              ...
            ]</pre>
      required:
      - ad
      - added_at
