      - id
      - name
    UserImage:
      type: object
      properties:
        original:
          type: string
          nullable: true
        large:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
      required:
      - large
      - original
      - thumbnail
    UserInfo:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        phones:
          type: string
          nullable: true
        name:
          type: string
        position:
          type: string
          nullable: true
        image:
          allOf:
          - $ref: '#/components/schemas/UserImage'
          nullable: true
          readOnly: true
        on_vacation:
          type: boolean
          readOnly: true
        absence:
          allOf:
          - $ref: '#/components/schemas/UserAbsence'
          nullable: true
          readOnly: true
        is_active:
          type: boolean
        language:
          type: string
          readOnly: true
        company:
          allOf:
          - $ref: '#/components/schemas/UserCompany'
          readOnly: true
      required:
      - absence
      - company
      - email
      - id
      - image
      - is_active
      - language
      - name
      - on_vacation
      - phones
      - position
    UserSetting:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
          additionalProperties: {}
          nullable: true
      required:
      - key
      - value
    flat:
      type: array
      items:
        type: object
        additionalProperties:
          type: string
      example:
      - marketplaces: Marketplaces
      - telegram: Telegram
      - facebook: Facebook
    with_hierarchy:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          title:
            type: string
          children:
            type: array
            items:
              type: object
        required:
        - id
        - title
        - children
      example:
      - id: messenger
        title: Messenger
        children:
        - id: telegram
          title: Telegram
          children: []
        - id: whatsapp
          title: WhatsApp
          children: []
      - id: phone
        title: Phone call
        children:
        - id: hotline
          title: Hotline
          children: []
