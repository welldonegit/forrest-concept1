          description: |-
            Notification category used by recipient notification settings.

            * `other` - other
            * `new_lead` - new_lead
            * `duplicate_lead` - duplicate_lead
            * `task` - task
            * `dialog` - dialog
            * `incoming_call` - incoming_call
            * `missed_call` - missed_call
            * `mentions` - mentions
            * `system` - system
      required:
      - idempotency_key
